<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增客戶 | PrintShop</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Noto Sans TC", sans-serif;
            background: #f5f6f8;
            color: #202124;
        }

        .topbar {
            background: #ffffff;
            border-bottom: 1px solid #e1e3e6;
            padding: 24px 40px;
        }

        .brand {
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 6px;
            color: #6b7280;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-title {
            margin: 0;
            font-size: 32px;
        }

        .description {
            margin: 8px 0 0;
            color: #6b7280;
        }

        .panel {
            background: #ffffff;
            border: 1px solid #e1e3e6;
            border-radius: 12px;
            padding: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            border: 1px solid #d5d9de;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 15px;
            background: #ffffff;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2684ff;
            box-shadow: 0 0 0 3px rgba(38, 132, 255, 0.12);
        }

        .required {
            color: #d93025;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
            padding-top: 22px;
            border-top: 1px solid #edf0f2;
        }

        .button {
            border: 1px solid #d5d9de;
            background: #ffffff;
            border-radius: 8px;
            padding: 11px 20px;
            font-size: 15px;
            cursor: pointer;
        }

        .button.primary {
            background: #2684ff;
            border-color: #2684ff;
            color: #ffffff;
        }

        .button:hover {
            opacity: 0.9;
        }

        @media (max-width: 700px) {
            .topbar {
                padding: 20px;
            }

            .container {
                padding: 24px 16px;
            }

            .panel {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="brand">PrintShop</div>
    <div class="subtitle">印刷店管理系統</div>
</header>

<main class="container">

    <section class="page-header">
        <h1 class="page-title">新增客戶</h1>
        <p class="description">建立客戶的基本資料。</p>
    </section>

    <section class="panel">

        <form method="POST">

            <div class="form-grid">

                <div class="field full">
                    <label for="company_name">
                        客戶名稱 <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="company_name"
                        name="company_name"
                        required
                        placeholder="例如：廣達數位印刷"
                    >
                </div>

                <div class="field">
                    <label for="contact_person">
                        聯絡人
                    </label>

                    <input
                        type="text"
                        id="contact_person"
                        name="contact_person"
                        placeholder="例如：王小明"
                    >
                </div>

                <div class="field">
                    <label for="tax_id">
                        統一編號
                    </label>

                    <input
                        type="text"
                        id="tax_id"
                        name="tax_id"
                        maxlength="8"
                        placeholder="例如：12345678"
                    >
                </div>

                <div class="field">
                    <label for="phone">
                        電話
                    </label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        placeholder="例如：05-1234567"
                    >
                </div>

                <div class="field">
                    <label for="category">
                        客戶分類
                    </label>

                    <select id="category" name="category">
                        <option value="一般">一般</option>
                        <option value="學校">學校</option>
                        <option value="公司">公司</option>
                        <option value="設計公司">設計公司</option>
                        <option value="個人">個人</option>
                        <option value="其他">其他</option>
                    </select>
                </div>

            </div>

            <div class="actions">
                <button
                    type="button"
                    class="button"
                    onclick="window.location.href='/customers'"
                >
                    取消
                </button>

                <button
                    type="submit"
                    class="button primary"
                >
                    儲存客戶
                </button>
            </div>

        </form>

    </section>

</main>

</body>
</html>
