{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>新增報價</h1>
    <p>先建立客戶與本次報價內容；歷史資料只作為參考與快速帶入。</p>
  </div>
  <a class="btn-secondary" href="{{ url_for('quotes_list') }}">回報價列表</a>
</div>

<form method="post" id="quote-form" class="quote-page">
  <section class="quote-top-grid">
    <div class="card quote-customer-card">
      <h2>客戶資料</h2>

      <div class="field">
        <label>客戶名稱 *</label>
        <input id="customer-name" name="customer_name" autocomplete="off"
               placeholder="輸入名稱搜尋既有客戶" required>
        <input type="hidden" id="customer-id" name="customer_id">
        <div id="customer-results" class="search-results"></div>
      </div>

      <div class="customer-meta-grid">
        <div class="field">
          <label>聯絡人</label>
          <input id="customer-contact" name="customer_contact">
        </div>
        <div class="field">
          <label>統編</label>
          <input id="customer-tax-id" name="customer_tax_id">
        </div>
        <div class="field">
          <label>電話</label>
          <input id="customer-phone" name="customer_phone">
        </div>
      </div>

      <div class="field">
        <label>報價備註</label>
        <textarea name="note" rows="3"></textarea>
      </div>

      <div class="quote-mode-row">
        <label><input type="radio" name="mode" value="normal" checked> 一般報價</label>
        <label><input type="radio" name="mode" value="project"> 專案模式</label>
      </div>

      <div id="project-name-wrap" class="field" hidden>
        <label>專案名稱 *</label>
        <input name="project_name" id="project-name" placeholder="例如：2026 教師甄選">
      </div>
    </div>

    <aside class="card history-card">
      <h2>歷史紀錄</h2>
      <div class="field">
        <input id="history-search" placeholder="搜尋歷史報價／訂單">
      </div>
      <div class="muted">
        選擇客戶後，這裡將作為歷史紀錄查詢與套用區。此區暫保留版面，搜尋邏輯後續驗收。
      </div>
    </aside>
  </section>

  <section id="normal-section" class="card quote-items-card">
    <div class="section-head">
      <h2>一般報價品項</h2>
    </div>
    <div id="normal-items"></div>
    <button type="button" class="btn-secondary add-item-btn" id="add-normal-item">＋ 新增品項</button>
  </section>

  <section id="project-section" class="card quote-items-card" hidden>
    <div class="section-head">
      <div>
        <h2>專案模式</h2>
        <p class="muted">可建立多個工作單位，每個工作單位可有多個品項。</p>
      </div>
      <button type="button" class="btn-secondary" id="add-work-unit">＋ 新增工作單位</button>
    </div>
    <div id="work-units"></div>
  </section>

  <section class="quote-footer card">
    <div>
      <div class="muted">預估總預算</div>
      <div class="quote-total" id="quote-total">NT$ 0</div>
    </div>
    <div class="quote-footer-actions">
      <a class="btn-secondary" href="{{ url_for('quotes_list') }}">取消</a>
      <button class="btn" type="submit">建立報價</button>
    </div>
  </section>

  <input type="hidden" name="items_json" id="items-json">
  <input type="hidden" name="work_units_json" id="work-units-json">
</form>

<template id="item-template">
  <div class="quote-item js-item-row">
    <div class="quote-item-head">
      <div>品項</div><div>材質</div><div>尺寸</div><div>後加工</div>
      <div>數量</div><div>單位</div><div>單價</div><div>小計</div>
    </div>
    <div class="quote-item-fields">
      <div class="item-field item-search-wrap">
        <input class="js-product" autocomplete="off" placeholder="填寫搜尋">
        <div class="item-search-results js-product-results"></div>
      </div>
      <div class="item-field"><input class="js-material" autocomplete="off" placeholder="填寫搜尋"></div>
      <div class="item-field"><input class="js-size" autocomplete="off" placeholder="填寫搜尋"></div>
      <div class="item-field">
        <input class="js-finishing-input" autocomplete="off" placeholder="填寫搜尋">
        <div class="finishing-tags js-finishing-tags"></div>
      </div>
      <div class="item-field"><input type="number" step="0.01" min="0" class="js-qty" value="1"></div>
      <div class="item-field"><input class="js-unit"></div>
      <div class="item-field"><input type="number" step="0.01" min="0" class="js-price" value="0"></div>
      <div class="item-subtotal js-subtotal">NT$ 0</div>
    </div>
    <div class="quote-item-note">
      <input class="js-note" placeholder="備註">
      <button type="button" class="btn-danger-soft js-remove">刪除</button>
    </div>
  </div>
</template>

<template id="work-unit-template">
  <div class="work-unit">
    <div class="work-unit-head">
      <div class="field work-unit-name-field">
        <label>工作單位名稱</label>
        <input class="js-work-unit-name" autocomplete="off" placeholder="填寫可搜尋客戶">
        <input type="hidden" class="js-work-unit-customer-id">
        <div class="search-results js-work-unit-results"></div>
      </div>
      <div class="field">
        <label>工作單位備註</label>
        <input class="js-work-unit-note" placeholder="可填文字">
      </div>
      <button type="button" class="btn-danger-soft js-remove-unit">刪除工作單位</button>
    </div>
    <div class="js-unit-items"></div>
    <button type="button" class="btn-secondary js-add-unit-item">＋ 新增品項</button>
  </div>
</template>
{% endblock %}

{% block scripts %}
<script>
(() => {
  const normalSection = document.getElementById('normal-section');
  const projectSection = document.getElementById('project-section');
  const projectNameWrap = document.getElementById('project-name-wrap');
  const normalItems = document.getElementById('normal-items');
  const workUnits = document.getElementById('work-units');
  const itemTemplate = document.getElementById('item-template');
  const workUnitTemplate = document.getElementById('work-unit-template');
  const totalEl = document.getElementById('quote-total');

  const money = n => 'NT$ ' + Number(n || 0).toLocaleString('zh-TW', {maximumFractionDigits: 2});

  async function fetchJson(url) {
    const res = await fetch(url);
    return res.ok ? res.json() : null;
  }

  function recalc() {
    let total = 0;
    document.querySelectorAll('.js-item-row').forEach(row => {
      const qty = Number(row.querySelector('.js-qty').value || 0);
      const price = Number(row.querySelector('.js-price').value || 0);
      const subtotal = qty * price;
      row.querySelector('.js-subtotal').textContent = money(subtotal);
      total += subtotal;
    });
    totalEl.textContent = money(total);
  }

  function setupProductSearch(row) {
    const input = row.querySelector('.js-product');
    const box = row.querySelector('.js-product-results');
    let timer;

    input.addEventListener('input', () => {
      clearTimeout(timer);
      const q = input.value.trim();
      if (!q) { box.innerHTML = ''; box.classList.remove('show'); return; }
      timer = setTimeout(async () => {
        const data = await fetchJson(`/api/specs/search?q=${encodeURIComponent(q)}`);
        if (!data) return;
        const quick = data.quick || [];
        const products = data.products || [];
        let html = '';
        if (quick.length) {
          html += '<div class="result-group-label">常用</div>';
          html += quick.map(x => `
            <button type="button" class="search-result quick"
              data-type="quick"
              data-product="${x.product_name || ''}"
              data-material="${x.material || ''}"
              data-size="${x.size || ''}"
              data-quantity="${x.quantity || ''}"
              data-unit="${x.unit || ''}"
              data-price="${x.unit_price ?? ''}"
              data-finishing="${x.finishing || ''}">
              <strong>★ ${x.name}</strong>
              <span>${[x.product_name,x.material,x.size,(x.quantity||'')+(x.unit||'')].filter(Boolean).join('｜')}</span>
            </button>`).join('');
        }
        if (products.length) {
          html += '<div class="result-group-label">品項</div>';
          html += products.map(x => `<button type="button" class="search-result" data-type="product" data-product-id="${x.id}" data-product="${x.name}"><strong>${x.name}</strong></button>`).join('');
        }
        box.innerHTML = html || '<div class="muted search-empty">沒有符合資料</div>';
        box.classList.add('show');

        box.querySelectorAll('.search-result').forEach(btn => {
          btn.addEventListener('click', async () => {
            input.value = btn.dataset.product || '';
            if (btn.dataset.type === 'quick') {
              row.querySelector('.js-material').value = btn.dataset.material || '';
              row.querySelector('.js-size').value = btn.dataset.size || '';
              if (btn.dataset.quantity) row.querySelector('.js-qty').value = btn.dataset.quantity;
              row.querySelector('.js-unit').value = btn.dataset.unit || '';
              if (btn.dataset.price) row.querySelector('.js-price').value = btn.dataset.price;
              setFinishings(row, btn.dataset.finishing || '');
            } else if (btn.dataset.productId) {
              await loadProductOptions(row, btn.dataset.productId);
            }
            box.classList.remove('show');
            recalc();
          });
        });
      }, 150);
    });
  }

  function setFinishings(row, csv) {
    const holder = row.querySelector('.js-finishing-tags');
    holder.innerHTML = '';
    const values = csv.split(',').map(v => v.trim()).filter(Boolean);
    values.forEach(v => {
      const tag = document.createElement('span');
      tag.className = 'finishing-tag';
      tag.textContent = '#' + v;
      tag.addEventListener('click', () => tag.remove());
      holder.appendChild(tag);
    });
  }

  async function loadProductOptions(row, productId) {
    const data = await fetchJson(`/api/specs/product/${productId}`);
    if (!data || !data.ok) return;
    row.querySelector('.js-unit').value = data.product.unit_name || '';
    attachDatalist(row.querySelector('.js-material'), data.materials || [], 'name');
    attachDatalist(row.querySelector('.js-size'), data.sizes || [], 'name');
    attachDatalist(row.querySelector('.js-qty'), data.quantities || [], 'value_text');
    setupFinishingSearch(row, data.finishings || []);
  }

  function attachDatalist(input, rows, key) {
    let id = input.dataset.listId;
    let dl = id ? document.getElementById(id) : null;
    if (!dl) {
      id = 'dl-' + Math.random().toString(36).slice(2);
      input.dataset.listId = id;
      input.setAttribute('list', id);
      dl = document.createElement('datalist');
      dl.id = id;
      document.body.appendChild(dl);
    }
    dl.innerHTML = '';
    rows.forEach(x => {
      const option = document.createElement('option');
      option.value = x[key];
      dl.appendChild(option);
    });
  }

  function setupFinishingSearch(row, options = []) {
    const input = row.querySelector('.js-finishing-input');
    input.onkeydown = e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const value = input.value.trim();
      if (!value) return;
      const allowed = !options.length || options.some(x => x.name === value);
      if (allowed) addFinishingTag(row, value);
      input.value = '';
    };
    attachDatalist(input, options, 'name');
  }

  function addFinishingTag(row, value) {
    const holder = row.querySelector('.js-finishing-tags');
    if ([...holder.children].some(x => x.dataset.value === value)) return;
    const tag = document.createElement('span');
    tag.className = 'finishing-tag';
    tag.dataset.value = value;
    tag.textContent = '#' + value + ' ×';
    tag.onclick = () => tag.remove();
    holder.appendChild(tag);
  }

  function createItem() {
    const frag = itemTemplate.content.cloneNode(true);
    const row = frag.querySelector('.js-item-row');
    setupProductSearch(row);
    setupFinishingSearch(row);
    row.querySelector('.js-qty').addEventListener('input', recalc);
    row.querySelector('.js-price').addEventListener('input', recalc);
    row.querySelector('.js-remove').onclick = () => {
      row.remove();
      recalc();
    };
    return row;
  }

  function createWorkUnit() {
    const frag = workUnitTemplate.content.cloneNode(true);
    const unit = frag.querySelector('.work-unit');
    const items = unit.querySelector('.js-unit-items');
    items.appendChild(createItem());
    unit.querySelector('.js-add-unit-item').onclick = () => items.appendChild(createItem());
    unit.querySelector('.js-remove-unit').onclick = () => { unit.remove(); recalc(); };
    setupCustomerSearch(
      unit.querySelector('.js-work-unit-name'),
      unit.querySelector('.js-work-unit-results'),
      c => unit.querySelector('.js-work-unit-customer-id').value = c.id || ''
    );
    return unit;
  }

  function setupCustomerSearch(input, box, onSelect) {
    let timer;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      const q = input.value.trim();
      if (!q) { box.innerHTML=''; box.classList.remove('show'); return; }
      timer = setTimeout(async () => {
        const data = await fetchJson(`/api/customers/search?q=${encodeURIComponent(q)}`);
        const rows = Array.isArray(data) ? data : (data?.customers || []);
        box.innerHTML = rows.map(c => `
          <button type="button" class="search-result"
            data-json='${JSON.stringify(c).replaceAll("'", "&#39;")}'>
            <strong>${c.name || ''}</strong>
            <span>${c.contact_person || c.contact || ''} ${c.phone || ''}</span>
          </button>`).join('');
        box.classList.toggle('show', rows.length > 0);
        box.querySelectorAll('.search-result').forEach(btn => {
          btn.onclick = () => {
            const c = JSON.parse(btn.dataset.json);
            input.value = c.name || '';
            onSelect(c);
            box.classList.remove('show');
          };
        });
      }, 150);
    });
  }

  setupCustomerSearch(
    document.getElementById('customer-name'),
    document.getElementById('customer-results'),
    c => {
      document.getElementById('customer-id').value = c.id || '';
      document.getElementById('customer-contact').value = c.contact_person || c.contact || '';
      document.getElementById('customer-tax-id').value = c.tax_id || c.tax_number || '';
      document.getElementById('customer-phone').value = c.phone || '';
    }
  );

  document.querySelectorAll('input[name="mode"]').forEach(r => {
    r.addEventListener('change', () => {
      const project = document.querySelector('input[name="mode"]:checked').value === 'project';
      normalSection.hidden = project;
      projectSection.hidden = !project;
      projectNameWrap.hidden = !project;
      document.getElementById('project-name').required = project;
      if (project && !workUnits.children.length) workUnits.appendChild(createWorkUnit());
      recalc();
    });
  });

  document.getElementById('add-normal-item').onclick = () => normalItems.appendChild(createItem());
  document.getElementById('add-work-unit').onclick = () => workUnits.appendChild(createWorkUnit());

  normalItems.appendChild(createItem());

  document.getElementById('quote-form').addEventListener('submit', () => {
    const serializeItem = row => ({
      product_name: row.querySelector('.js-product').value.trim(),
      material: row.querySelector('.js-material').value.trim(),
      size: row.querySelector('.js-size').value.trim(),
      finishing: [...row.querySelectorAll('.finishing-tag')].map(x => (x.dataset.value || x.textContent.replace(/^#| ×$/g,''))).join(','),
      quantity: row.querySelector('.js-qty').value,
      unit: row.querySelector('.js-unit').value.trim(),
      unit_price: row.querySelector('.js-price').value,
      note: row.querySelector('.js-note').value.trim()
    });

    document.getElementById('items-json').value =
      JSON.stringify([...normalItems.querySelectorAll('.js-item-row')].map(serializeItem));

    document.getElementById('work-units-json').value =
      JSON.stringify([...workUnits.querySelectorAll('.work-unit')].map(unit => ({
        name: unit.querySelector('.js-work-unit-name').value.trim(),
        linked_customer_id: unit.querySelector('.js-work-unit-customer-id').value || null,
        note: unit.querySelector('.js-work-unit-note').value.trim(),
        items: [...unit.querySelectorAll('.js-item-row')].map(serializeItem)
      })));
  });
})();
</script>
{% endblock %}
